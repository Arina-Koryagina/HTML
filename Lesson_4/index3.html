<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
            *
            {
                font-family: Segoe UI;
            }
            ul
            {
                list-style-type: none;
                width: 300px;
            }
            li
            {
                background-color: #808080;
            }
            li:hover
            {
                background-color: #5e5e5e;
            }
            img
            {
                width: 70px;
                float: left;
            }
            p
            {
                margin: 0;
                padding: 20px 0 0 80px;
                font-size: 18px;
                text-transform: uppercase;
                color: white;
            }
            a
            {
                text-decoration: none;
                margin: 0;
                padding: 0;
            }
            .clear
            {
                clear: both;
            }

        </style>
    </head>
    <body>
        <ul>
            <li>
        	    <a href="">
                    <div class="link">
                        <img src="icons/edit.png" alt="">
                        <p>Edit</p>
                        <div class="clear"></div>
                    </div>
        	    </a>
        	</li>
            <li>
        		<img src="icons/favorites.png" alt="">
        		<p>Favourites</p>
        		<div class="clear"></div>
        	</li>
        	<li>
        		<img src="icons/history.png" alt="">
        		<p>History</p>
        		<div class="clear"></div>
        	</li>
        	<li>
        		<img src="icons/security.png" alt="">
        		<p>Security</p>
        		<div class="clear"></div>
        	</li>
            <li>
        		<img src="icons/settings.png" alt="">
        		<p>Settings</p>
        		<div class="clear"></div>
        	</li>
        </ul>
    </body>
</html>
