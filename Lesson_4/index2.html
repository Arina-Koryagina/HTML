<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Document</title>
        <style>
            *
            {
                font-family: Segoe UI;
                font-weight: bold;
                text-align: center;
            }
            .container
            {
                margin: auto;
            }
            .block
            {
                width: 168px;
                padding: 30px 10px;
                margin: 10px;
                border: 1px solid #A2A2A2;
                border-radius: 30px;
                float: left;
            }
            p
            {
                font-size: 18px;
                margin: 20px 0 0;
            }
            img
            {
                display: block;
                margin: auto;
            }
            .clear
            {
                clear: both;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>What do I have in my fridge?</h2>
            <div class="block">
            	<img src="icons/Food_C247-128.png" alt="">
            	<p>Pepper</p>
            </div>
            <div class="block">
            	<img src="icons/Food_C240-128.png" alt="">
            	<p>Apple</p>
            </div>
            <div class="block">
            	<img src="icons/Food_C217-128.png" alt="">
            	<p>Cheese</p>
            </div>
            <div class="block">
            	<img src="icons/Food_C245-128.png" alt="">
            	<p>Corn</p>
            </div>
            <div class="block">
            	<img src="icons/Food_C239-128.png" alt="">
            	<p>Mushroom</p>
            </div>
            <div class="block">
            	<img src="icons/Food_C238-128.png" alt="">
            	<p>Garlic</p>
            </div>
            <div class="block">
            	<img src="icons/Food_C225-128.png" alt="">
            	<p>Beef</p>
            </div>
            <div class="block">
            	<img src="icons/Food_C205-128.png" alt="">
            	<p>Fish</p>
            </div>
            <div class="block">
            	<img src="icons/Food_C203-128.png" alt="">
            	<p>Eggs</p>
            </div>
            <div class="block">
            	<img src="icons/Food_C235-128.png" alt="">
            	<p>Coriander</p>
            </div>
            <div class="clear"></div>
            <hr>
            <p>... that's all ...</p>
        </div>
    </body>
</html>
