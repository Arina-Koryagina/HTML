<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
            *
            {
                font-family: Segoe UI;
                color: white;
                font-size: 14px;
            }
            body
            {
                background-color: #2A4F6E;
            }
            ol
            {
                float: left;
                list-style-type: none;
                padding: 0px 100px 0px 100px;
            }
            li
            {
                padding-bottom: 10px;
                margin: 0;
            }
            li:hover
            {
                text-decoration: underline;
            }
            img
            {
                width: 30px;
                padding-top: 20px;
                padding-right: 20px;
                filter: grayscale();
            }
            img:hover
            {
                filter: grayscale(0);
            }
            .credits
            {
                font-size: 12px;
                text-align: center;
                padding-top: 10px;
            }
            .image li
            {
                display: inline-block;
            }
            .clear
            {
                clear: both;
            }
        </style>
    </head>
    <body>
       <div>
        <ol>
       		<li>Home</li>
       		<li>About</li>
       		<li>Gallery</li>
       		<li>News</li>
       	</ol>
       </div>
       <div>
       	<ol>
       		<li>Blog</li>
       		<li>FAQ</li>
       		<li>Contacts</li>
       		<li>Privacy &amp; cookies</li>
       	</ol>
       </div>
       <div>
       	<ol class="image">
       		<li><a href=""><img src="icons/fb.png" alt=""></a></li>
       		<li><a href=""><img src="icons/insta.png" alt=""></a></li>
       		<li><a href=""><img src="icons/youtube.png" alt=""></a></li>
       	</ol>
        </div>
        <div class="clear"></div>
        <hr>
        <p class="credits">Copyright &#169; Company 2018 - 2019</p>
    </body>
</html>
