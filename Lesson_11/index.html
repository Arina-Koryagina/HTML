<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
            .cont{
                display: flex;
                border: 1px solid;
                height: 315px;
                flex-direction: row;
                /*flex-wrap: wrap;*/

                /*justify-content: space-evenly;*/

                align-items: flex-start;
                align-content: space-around;
            }
            .bl{
                padding: 20px 40px;
                /*width: 50px;*/
                /*height: 100px;*/
                /*flex-basis: 100px;*/
            }
            .bl1{
                background-color: aqua;
                flex-basis: 25%;
                order: 1;
                align-self: center;
            }
            .bl2{
                background-color: chartreuse;
                flex-basis: 50px;
            }
            .bl3{
                background-color: darkorange;
                /*width: 30px;*/
                /*height: 40px;*/
                flex-grow: 4;
            }
            .bl4{
                background-color: coral;
                flex-grow: 10;
                order: -1;
            }
        </style>
    </head>
    <body>
        <div class="cont">
        	<div class="bl bl1">1</div>
        	<div class="bl bl2">2</div>
        	<div class="bl bl3">3</div>
        	<div class="bl bl4">4</div>
        </div>
    </body>
</html>
