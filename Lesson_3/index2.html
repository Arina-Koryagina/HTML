<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Seasons</title>
        <style>
            *
            {
                font-family: Segoe UI;
            }
            .seasons
            {
                list-style-image: url(pics/arrow_16.png);
            }
            .month1
            {
                list-style-image: url(pics/winter_16.png);
            }
            .month2
            {
                list-style-image: url(pics/spring_16.png);
            }
            .month3
            {
                list-style-image: url(pics/summer_16.png);
            }
            .month4
            {
                list-style-image: url(pics/autumn_16.png);
            }
        </style>
    </head>
    <body>
        <!--ul.seasons>(li>ul.month$>li*3)*4-->
        <h3>Seasons</h3>
        <ul class="seasons">
        	<li>Winter
        		<ul class="month1">
                        <li>December</li>
                        <li>January</li>
                        <li>February</li>
        		</ul>
        	</li>
        	<li>Spring
        		<ul class="month2">
                       <li>March</li>
                       <li>April</li>
                       <li>May</li>
        		</ul>
        	</li>
        	<li>Summer
        		<ul class="month3">
                        <li>September</li>
                        <li>October</li>
                        <li>November</li>
        		</ul>
        	</li>
        	<li>Autumn
        		<ul class="month4">
                        <li>September</li>
                        <li>October</li>
                        <li>November</li>
        		</ul>
        	</li>
        </ul>
    </body>
</html>
