<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
            *{
                font-family: Segoe UI;
                padding: 0;
                margin: 0;
            }
            .item1{
                background-color: aqua;
                /*
                grid-column-start: 1;
                grid-column-end: 3;
                */
                grid-column: 1/3;

                /*
                grid-row-start: 1;
                grid-row-end: 2;
                */
                grid-row: 1/3;
            }
            .item2{
                background-color: brown;
                grid-column-start: 3;
                grid-column-end: 4;

                grid-row-start: 2;
                grid-row-end: 4;
            }
            .item3{background-color: darkgoldenrod;}

            .grid-cont{
                display: grid;
                padding: 15px 20px;
                background-color: blueviolet;
                /*grid-template-columns: 120px auto 200px;*/
                grid-template-rows: repeat(4, 100px);

                /*grid-template-columns: 2fr 1fr 1fr;*/
                grid-template-columns: repeat(3, 1fr);

                grid-column-gap: 25px;
                grid-row-gap: 25px;

            }

            .grid-cont > div{
                padding: 20px;
                /*margin: 10px;*/
            }

            .item4{
                background-color: chartreuse;
                /*grid-area: 3/1/5/3;*/

                grid-column: 1 / span 2;
                grid-row: 3 / span 2;
            }
        </style>
    </head>
    <body>
        <div class="grid-cont">
        	<div class="item1">Item 1</div>
        	<div class="item2">Item 2</div>
        	<div class="item3">Item 3</div>
        	<div class="item4">Item 4</div>
        	<div class="item5">Item 5</div>
        	<div class="item6">Item 6</div>
        	<div class="item7">Item 7</div>
        	<div class="item8">Item 8</div>
        	<div class="item9">Item 9</div>
        </div>
    </body>
</html>
