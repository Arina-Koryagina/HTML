<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <!--https://materials.itstep.org/content/d7151bde-e75f-432b-9e17-aa860373a6d4/uk-->
        <style>
            *
            {
                font-family: Segoe UI;
                text-transform: uppercase;
                color: white;
                font-weight: bold;
                padding: 0;
                margin: 0;
            }
            .container
            {
                width: 960px;
                margin: 20px;
            }
            .header
            {
                background-color: #923158;
                margin-bottom: 10px;
                padding: 20px;
                padding-left: 30px;
            }
            .menu
            {
                background-color: #6E1237;
                margin-bottom: 10px;
                padding: 10px;
                padding-left: 30px;
            }
            .right
            {
                float: left;
                margin-right: 10px;
            }
            .block1
            {
                background-color: #B65B80;
                width: 200px;
                height: 30px;
                margin-bottom: 10px;
                padding: 20px;
                padding-left: 30px;
            }
            .block2
            {
                background-color: #B65B80;
                width: 200px;
                height: 70px;
                padding: 20px;
                padding-left: 30px;
            }
            .block3
            {
                background-color: #B65B80;
                width: 90px;
                height: 160px;
                padding: 20px;
                padding-left: 30px;
                float: left;
            }
            .main
            {
                float: left;
                background-color: #B65B80;
                width: 500px;
                margin-right: 10px;
                margin-bottom: 10px;
                padding: 20px;
                padding-left: 30px;
                height: 250px;
            }
            .cont
            {
                background-color: #DB92AF;
                padding: 20px;
                padding-left: 30px;
                margin: 10px 0 10px 0;
                height: 50px;
            }
            .clear
            {
                clear: both;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <p>header</p>
            </div>
            <div class="menu">
                <p>menu</p>
            </div>
            <div class="right">
                <div class="block1">
                    <p>aside 1</p>
                </div>
                <div class="block2">
                    <p>aside 2</p>
                </div>
            </div>
            <div class="main">
                <p>main content</p>
                <div class="cont">
                    <p>section 1</p>
                </div>
                <div class="cont">
                    <p>section 2</p>
                </div>
            </div>
            <div class="block3">
                <p>aside 3</p>
            </div>
            <div class="clear"></div>
            <div class="menu">
                <p>footer</p>
            </div>
        </div>
    </body>
</html>
