<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
            *
            {
                font-family: Segoe UI;
                color: white;
                font-size: 14px;
            }
            body
            {
                background-color: #2A4F6E;
                margin: 25px;
            }
            .container
            {
                width: 1000px:
            }
            .container ol
            {
                width: 200px;
                list-style-type: none;
                float: left;
                padding: 0px;
                margin: 0 40px;
            }
            li
            {
                padding-bottom: 10px;
                margin: 0;
            }
            li:hover
            {
                text-decoration: underline;
            }
            img
            {
                width: 36px;
                margin-top: 30px;
                filter: grayscale();
            }
            img:hover
            {
                filter: grayscale(0);
            }
            .credits
            {
                font-size: 12px;
                text-align: center;
                padding-top: 10px;
            }
            .image
            {
                float: right;
            }
            .image li
            {
                display: inline-block;
                margin-left: 10px;
            }
            .clear
            {
                clear: both;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <ol>
                <li>Home</li>
                <li>About</li>
                <li>Gallery</li>
                <li>News</li>
            </ol>
            <ol>
                <li>Blog</li>
                <li>FAQ</li>
                <li>Contacts</li>
                <li>Privacy &amp; cookies</li>
            </ol>
            <ol class="image">
                <li><a href=""><img src="icons/fb.png" alt=""></a></li>
                <li><a href=""><img src="icons/insta.png" alt=""></a></li>
                <li><a href=""><img src="icons/youtube.png" alt=""></a></li>
            </ol>
        </div>
        <div class="clear"></div>
        <hr>
        <p class="credits">Copyright &#169; Company 2018 - 2019</p>
    </body>
</html>
