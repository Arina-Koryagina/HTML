<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
            .container
            {
                width: 800px;
            }
            .row
            {
                height: 200px;
                transition: all 0.3s ease;
            }
            .col
            {
                height: 200px;
                width: 400px;
                text-align: center;
                align-content: space-around;
                overflow: hidden;
                float: left;
            }
            p
            {
                font-family: Segoe UI;
                font-size: 16px;
            }
            img
            {
                float: left;
                width: 100%;
                height: 100%;
                object-fit: cover;

                transition: all 1s ease;
            }
            .row:hover
            {
                background-color: rgba(0, 0, 0, 0.5);
            }
            .row:hover img
            {
                transform: scale(1.2);
            }
        </style>
    </head>
    <body>
        <div class="container">
        	<div class="row">
        		<div class="col">
        			<p>HELLO, WORLD!</p>
        		</div>
        		<div class="col">
        		    <img src="pics/NGC_6072.jpg">
        		</div>
        	</div>
        	<div class="row">
        		<div class="col">
        		    <img src="pics/NGC_6072.jpg">
        		</div>
        		<div class="col">
        			<p>HELLO, WORLD!</p>
        		</div>
        	</div>
        	<div class="row">
        		<div class="col">
        			<p>HELLO, WORLD!</p>
        		</div>
        		<div class="col">
        		    <img src="pics/NGC_6072.jpg">
        		</div>
        	</div>
        </div>
    </body>
</html>
