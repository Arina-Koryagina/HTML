<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Title</title>
	<style>
        *
        {
            font-family: Segoe UI;
            box-sizing: border-box;
        }
        .content
        {
            padding-top: 200px;
            margin: auto;
            width: 600px;
        }
        .box
        {
            width: 300px;
            height: 150px;
            border: 5px solid #651142;
            background-color: #872d62;
            perspective-origin: left;
            perspective: 1000px;
        }
        .block
        {
            text-align: center;
            transition: transform 0.5s ease 0;
            margin-top: -100px;
        }
        .w1
        {
            float: left;
            transform-origin: left;
        }
        .w2
        {
            margin-left: 300px;
            transform-origin: right;
        }
        .block:hover>.w1
        {
            transform: perspective(500px) rotateY(20deg);
        }
        .block:hover>.w2
        {
            transform: perspective(500px) rotateY(-20deg);
        }
        h3
        {
            margin-bottom: -80px;
        }
    </style>
</head>
<body>
	<div class="content">
        <div class="block">
            <h3>HELLO</h3>
	        <div class="box w1"></div>
	        <div class="box w2"></div>
        </div>
	</div>
</body>
</html>
