<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
            .bar
            {
                width: 300px;
                height: 60px;
                border: 4px solid #FF8C00;
                margin: 20px;
            }

            .p
            {
                width: 60px;
                height: 60px;
                margin: 0;
                background-color: #FF8C00;
                animation: progr 2s linear alternate infinite;
            }

            @keyframes progr
            {
                from{margin-left: 0;}
                to{margin-left: 240px;}
            }
        </style>
    </head>
    <body>
        <div class="bar">
            <p class="p"></p>
        </div>
    </body>
</html>
