<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
            *{
                font-family: Segoe UI;
                padding: 0;
                margin: 0;
            }
            .cont{
                width: 700px;
                height: 480px;
                margin: 20px;
                position: relative;
                justify-self: center;
            }
            .fg{
                top: 35px;
                left: 0;
                position: relative;
                z-index: 1;
            }
            .bg{
                width: 100%;
                height: 100%;
                background-color: #9FCDCD;
                border-radius: 15px;
                display: flex;
                justify-content: end;
                align-items: flex-end;
                overflow: hidden;
                top: 0;
                left: 0;
                position: absolute;
                z-index: 0;
            }
            img{
                margin: -70px -105px;
                height: 350px;
            }
            .label{
                width: fit-content;
                margin: 25px 0 0 -20px;
                background-color: #DB6423;
            }
            .label p{
                text-transform: uppercase;
                color: white;
                font-weight: 700;
                font-size: 18px;
                padding: 20px 280px 20px 70px;
            }
            .form-grid{
                display: flex;
                flex-wrap: wrap;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
                width: 400px;
                padding: 35px;
                border-radius: 8px;
            }
            .form-field{
                display: flex;
                flex-direction: column;
            }
            .form-field label{
                margin-bottom: 6px;
                font-weight: bold;
                font-weight: 300;
                color: #6B6C6F;
            }
            .form-field input{
                padding: 10px;
                font-size: 18px;
                border: none;
                border-bottom: 1px solid #466C6F;
                background-color: #A9D2D2;
            }
            .top{
                display: flex;
                flex-wrap: wrap;
            }
            .top .form-field{
                width: 400px;
                margin-bottom: 25px;
            }
            .expire-grid{
                display: grid;
                grid-template-columns: 1fr 2fr;
                gap: 20px;
            }
            .bottom{
                display: flex;
                gap: 20px;
                margin-top: -20px;
            }
            .bottom input{
                width: 100px;
            }
        </style>
    </head>
    <body>
        <div class="cont">
        	<div class="fg">
        		<div class="label">
        		    <p>credit card details</p>
        		</div>
        		<div class="info">
        			<form action="get">
        			    <div class="form-grid">
                            <div class="top">
                                <div class="form-field">
                                    <label for="card-number">Card Number</label>
                                    <input id="card-number" type="text" placeholder="1234 5678 9012 3456">
                                </div>
                                <div class="form-field">
                                    <label for="name">Name On Card</label>
                                    <input id="name" type="text" placeholder="Name Surname">
                                </div>
                            </div>
                            <div class="bottom">
                                <div class="form-field">
                                    <label for="expire">Expire Date</label>
                                    <div class="expire-grid">
                                        <input type="text" placeholder="02">
                                        <input type="text" placeholder="2017">
                                    </div>
                                </div>
                                <div class="form-field">
                                    <label for="csv">CSV No.</label>
                                    <input id="csv" type="text" placeholder="***">
                                </div>
                            </div>
                        </div>
        			</form>
        		</div>
        	</div>
        	<div class="bg">
        	    <img src="icons_ht/icons_ht/moon_flag.png" alt="">
        	</div>
        </div>
    </body>
</html>
