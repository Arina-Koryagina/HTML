<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
        *{
            box-sizing: border-box;
            font-family: Segoe UI;
        }
        .cont{
            padding-top: 200px;
            margin: auto;
            width: 600px;
        }
        .box{
            width: 300px;
            height: 150px;
            border: 5px solid #651142;
            background-color: #872d62;
            perspective-origin: left;
            perspective: 1000px;
        }
        .block{
            text-align: center;
            transition: transform 0.5s ease 0;
            margin-top: -100px;
        }
        .b1{
            float: left;
            transform-origin: left;
        }
        .b2{
            margin-left: 300px;
            transform-origin: right;
        }
        .block:hover>.b1, .block:hover>.b2{
            transform: perspective(500px) rotateY(20deg);
            /*animation: a1 2s linear forwards;*/
        }
        .block:hover>.b2{
            transform: perspective(500px) rotateY(-20deg);
        }
        h3{
            margin-bottom: -80px;
        }
        @keyframes a1{
            0%{transform: perspective(0px); rotateY(0deg);}
            100%{transform: perspective(300px); rotateY(-40deg);}
        }
    </style>
</head>
<body>
	<div class="cont">
        <div class="block"><h3>HELLO</h3>
	        <div class="box b1"></div>
	        <div class="box b2"></div>
        </div>
	</div>
</body>
</html>
