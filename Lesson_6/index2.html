<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
            *
            {
                padding: 0;
                margin: 0;
            }
            .bar
            {
                width: 300px;
                height: 60px;
                border: 4px solid #FF8C00;
                margin: 20px;
            }
            .p
            {
                width: 60px;
                height: 60px;
                background-color: #FF8C00;
                animation: progr 2s linear alternate infinite;
            }

            @keyframes progr
            {
                from{margin-left: 0;}
                to{margin-left: 240px;}
            }

            .heart
            {
                width: 128px;
                margin: 60px;
                filter: grayscale(1);

            }

            .heart:hover
            {
                animation: trans 5s linear forwards;
            }

            @keyframes trans
            {
                from{filter: grayscale(1);}
                to{filter: grayscale(0); transform: scale(2);}
            }

            .site
            {
                background-color: #FAFAD2;
                width: 1100px;
                height: 500px;
                overflow: hidden;
            }

            h1
            {
                font-family: Segoe UI;
                text-transform: uppercase;
                text-align: center;
                padding-top: 30px;
                margin-bottom: 50px;
            }

            img
            {
                float: left;
            }

            .img1
            {
                transform: scale(0.5) rotate(-30deg);
                transform-origin: center right;
                animation: icon 2s linear forwards;
                margin-top: 500px;
            }
            .img2
            {
                transform: scale(0.8) rotate(-15deg);
                transform-origin: top;
                animation: icon 2s linear forwards 0.5s;
                margin-top: 500px;
            }
            .img3
            {
                transform: scale(0.8) rotate(15deg);
                transform-origin: top;
                animation: icon 2s linear forwards 1s;
                margin-top: 500px;
            }
            .img4
            {
                transform: scale(0.5) rotate(220deg);
                margin-left: -90px;
                animation: icon4 2s linear forwards 1.5s;
                margin-top: 500px;
            }
            .img5
            {
                transform: scale(0.8) rotate(90deg);
                margin-left: 450px;
                animation: icon5 2s linear forwards 2s;
                margin-top: 500px;
            }

            @keyframes icon
            {
                from{margin-top: 500px;}
                to{margin-top: 0px;}
            }

            @keyframes icon4
            {
                from{margin-top: 500px;}
                to{margin-top: 40px;}
            }

            @keyframes icon5
            {
                from{margin-top: 500px;}
                to{margin-top: -80px;}
            }

        </style>
    </head>
    <body>
        <div class="bar">
            <p class="p"></p>
        </div>

        <img src="icons_practice_module_4/favorites.png" class="heart">

        <div class="site">
        	<h1>hello, my site!</h1>
        	<img src="icons_practice_module_4/calc.png" class="img1">
        	<img src="icons_practice_module_4/book.png" class="img2">
        	<img src="icons_practice_module_4/paper.png" class="img3">
        	<img src="icons_practice_module_4/pallete.png" class="img4">
        	<img src="icons_practice_module_4/pencil.png" class="img5">
        </div>
    </body>
</html>
